name: Voice lab

# Push a tag named voicelab-<anything>. Produces a DRAFT release with sample voices to listen to.
on:
  push:
    tags: ["voicelab-*"]

permissions:
  contents: write

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg libsndfile1
      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install chatterbox-tts "kokoro>=0.9.4" soundfile edge-tts
      - name: Generate the samples
        run: python voice_lab.py
      - name: Save the timings where they can be read
        run: |
          git config user.name "voice-lab"; git config user.email "voice-lab@users.noreply.github.com"
          git checkout -b voicelab-results
          mkdir -p voicelab_results; cp voice_lab_out/timings.json voicelab_results/timings.json; ls voice_lab_out > voicelab_results/files.txt
          git add voicelab_results; git commit -m "voice lab results"; git push -f origin voicelab-results
      - name: Draft release with the samples
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la voice_lab_out
          gh release create "$GITHUB_REF_NAME" voice_lab_out/* --draft --title "Voice lab ($GITHUB_REF_NAME)" --notes "Sample voices. Draft: only repo writers can see it."
